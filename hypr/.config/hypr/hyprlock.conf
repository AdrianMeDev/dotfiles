# hyprlang (hyprlock still reads .conf). Values come from theme/tokens.toml,
# checked by tests/test_theme.py. Colors: rgba(RRGGBBAA), alpha_hex = bf.
background {
    monitor =
    path = ~/.local/share/dotfiles/wallpaper.png
    color = rgba(1a1b26ff)
    blur_size = 8
    blur_passes = 3
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    rounding = 8
    dots_center = true
    outer_color = rgba(7aa2f7ff)
    inner_color = rgba(1a1b26bf)
    font_color = rgba(c0caf5ff)
    check_color = rgba(e0af68ff)
    fail_color = rgba(f7768eff)
    font_family = IoskeleyMonoTerm Nerd Font Mono
    placeholder_text = <span foreground="##565f89">Password</span>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(c0caf5ff)
    font_size = 15
    font_family = IoskeleyMonoTerm Nerd Font Mono
    position = 0, 80
    halign = center
    valign = center
}
