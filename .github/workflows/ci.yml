name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck stow zsh luajit tmux
      - run: bash scripts/check.sh

  containers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, fedora, debian]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: bash scripts/container-matrix.sh ${{ matrix.distro }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
