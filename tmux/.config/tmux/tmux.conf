# Idea:
# - one tmux session per project
# - tmux handles panes/processes
# - Neovim handles code splits/tabs inside the editor

# Easier prefix than Ctrl-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Quality of life
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0
set -g history-limit 100000
setw -g mode-keys vi

# Keep the status bar simple
set -g status-left-length 30
set -g status-right-length 80
set -g status-left '#S '
set -g status-right '#H | %Y-%m-%d %H:%M '
set -g status-style 'fg=#a9b1d6,bg=#1a1b26'
set -g status-left-style 'fg=#1a1b26,bg=#7aa2f7,bold'
set -g status-right-style 'fg=#a9b1d6,bg=#1a1b26'
set -g window-status-style 'fg=#565f89,bg=#1a1b26'
set -g window-status-current-style 'fg=#1a1b26,bg=#bb9af7,bold'
set -g pane-border-style 'fg=#414868'
set -g pane-active-border-style 'fg=#7aa2f7'
set -g message-style 'fg=#1a1b26,bg=#e0af68'
set -g mode-style 'fg=#1a1b26,bg=#7dcfff'

# Hide the tmux status bar to avoid duplicating WezTerm and Neovim UI.
# tmux becomes the invisible process/pane manager.
set -g status off

# Keep normal terminal copy/scroll behavior.
# If you want tmux mouse support later, change this to: set -g mouse on
set -g mouse off

# Split panes in the current directory
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"

# Vim-like pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Shift + hjkl after prefix
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# New window in the current directory
bind c new-window -c "#{pane_current_path}"

# Reload config quickly
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux.conf reloaded'

# True color and system clipboard; gracefully fall back on non-Wayland sessions.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-256color:RGB'
set -g set-clipboard on
if-shell 'test -x /usr/bin/zsh' 'set -g default-shell /usr/bin/zsh'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
if-shell 'test -n "$WAYLAND_DISPLAY" && command -v wl-copy >/dev/null 2>&1' \
    'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"'
bind S set-option -g status
