# Single source of truth for the unified theme (Tokyo Night, "Night" variant).
# Consumers are checked against this file by tests/test_theme.py.

[meta]
name = "Tokyo Night"
variant = "night"

[palette]
bg = "#1a1b26"
bg_dark = "#16161e"
bg_highlight = "#292e42"
fg = "#c0caf5"
fg_dark = "#a9b1d6"
comment = "#565f89"
border = "#414868"
border_active = "#7aa2f7"
red = "#f7768e"
orange = "#ff9e64"
yellow = "#e0af68"
green = "#9ece6a"
teal = "#73daca"
cyan = "#7dcfff"
blue = "#7aa2f7"
blue_bright = "#2ac3de"
magenta = "#bb9af7"

[diff]
add = "#20303b"
change = "#1f2231"
delete = "#37222c"
text = "#394b70"

[font]
editor_family = "Ioskeley Mono"
terminal_family = "IoskeleyMonoTerm Nerd Font Mono"

[font.size]
editor = 14
terminal = 14
ui = 15
bar = 12

[window]
opacity = 0.75
alpha_hex = "bf"

[window.blur]
enabled = true
radius = 8
passes = 3

[border]
width = 2
radius = 8
style = "rounded"
